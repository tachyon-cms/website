<!doctype html>
<!-- The avatar and social preview, rendered by brand/build.mjs: #avatar at 512 and
     1024 square, #social at 1280x640. The mark is public/brand/mark.svg, so run the
     SVG build first (build.mjs does). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url("../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2"); }
  @font-face { font-family: Inter; font-weight: 600; src: url("../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 400; src: url("../node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2"); }
  /* Values from src/brand/tokens.css. */
  :root { --bg: #0c0d0d; --line: #242628; --text: #f4f5f6; --muted: #94979e; --blue: #3da9ff; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  section { display: none; position: relative; width: 100%; height: 100%; overflow: hidden; }
  section:target { display: block; }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgb(61 169 255 / 0.22), transparent); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); }

  /* The mark's strokes and point span 7-59 by 11-55 of its 64 box, so its visual centre is
     (33, 33): nudged up and left a hair to sit in the middle. A circular crop keeps all of it. */
  #avatar .glow { inset: 12%; }
  #avatar img { position: absolute; width: 62%; left: 18.4%; top: 18.4%; }

  #social { padding: 80px 88px; display: flex; flex-direction: column; }
  #social .grid { background-size: 64px 64px; mask-image: radial-gradient(70% 90% at 85% 0%, #000 10%, transparent 70%); opacity: 0.6; }
  #social .glow { width: 900px; height: 700px; right: -300px; top: -360px; }
  .lockup { position: relative; display: flex; align-items: center; gap: 18px; font-weight: 600; font-size: 40px; letter-spacing: -0.02em; }
  .lockup img { width: 60px; height: 60px; }
  h1 { position: relative; margin-top: auto; max-width: 15ch; font-size: 76px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }
  p { position: relative; margin-top: 28px; font-size: 28px; color: var(--muted); }
  .url { margin-top: 36px; font: 400 22px "Geist Mono", monospace; color: var(--blue); }
</style>
</head>
<body>
  <section id="avatar">
    <div class="glow"></div>
    <img src="../public/brand/mark.svg" alt="">
  </section>
  <section id="social">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="lockup"><img src="../public/brand/mark.svg" alt="">TachyonCMS</div>
    <h1>Content at the speed of your code.</h1>
    <p>An open-source headless CMS. One Rust binary, one Postgres database.</p>
    <p class="url">tachyoncms.com</p>
  </section>
</body>
</html>
