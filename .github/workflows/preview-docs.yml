name: Preview docs

# Every push to a branch uploads the docs as a new Worker version without
# deploying it, so docs.tachyoncms.com doesn't change, and puts the version's
# preview URL in the job summary. Never on pull_request: a fork's PR must not
# reach the Cloudflare secrets. Never on main: deploy-docs.yml ships main.
#
# Trust split. The branch's code is unreviewed, so it never runs next to the
# Cloudflare token:
# - build runs the branch's npm ci and docs build with no secrets, and hands on
#   only the built static files as an artifact.
# - upload has the secrets and never checks out the branch. It checks out main,
#   installs wrangler from main's lockfile with install scripts off, and takes
#   the Worker config from main, so a branch can't change the Worker's name, add
#   bindings to its preview, or choose what runs with the token.
#
# Preview URLs are public (Cloudflare sends noindex) and stay up after the
# branch is deleted. See CONTRIBUTING.md.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: preview-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'tachyon-cms/website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # From the root: the docs are a workspace and import ../scripts/csp.mjs.
      - run: npm ci
      - run: npm run build:docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error
          retention-days: 1

  upload:
    if: github.repository == 'tachyon-cms/website'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Without the Cloudflare secrets, skip with a notice instead of failing.
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so no docs preview was made."
          fi
      # main, never the branch: wrangler and every dependency under it come from
      # main's lockfile, with install scripts off, and so does the Worker config.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The docs workspace holds wrangler; the root's own dev tools aren't needed.
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts --workspace docs
      # The branch's files land outside the checkout, beside main's config, so
      # nothing from the branch sits where npm or wrangler look for config.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: ${{ runner.temp }}/preview/dist
      - if: steps.secrets.outputs.ready == 'true'
        name: Take the Worker config from main
        id: config
        env:
          PREVIEW: ${{ runner.temp }}/preview
        run: |
          cp docs/wrangler.jsonc "$PREVIEW/wrangler.jsonc"
          name=$(sed '/^[[:space:]]*\/\//d' docs/wrangler.jsonc | jq -er .name)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # `versions upload` doesn't change the Worker's settings, so turn preview URLs
      # on here. docs/wrangler.jsonc sets preview_urls too, so a main deploy keeps
      # them on; the workers.dev route stays off.
      - if: steps.secrets.outputs.ready == 'true'
        name: Turn on preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.config.outputs.name }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
            --data '{"enabled":false,"previews_enabled":true}' > /dev/null
      - if: steps.secrets.outputs.ready == 'true'
        name: Upload a preview version
        working-directory: ${{ runner.temp }}/preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          BRANCH: ${{ github.ref_name }}
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" versions upload -c wrangler.jsonc --message "$BRANCH ${GITHUB_SHA::7}"
          url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler uploaded the version but gave no preview URL."
            exit 1
          fi
          # The preview must serve the page and the same CSP the live docs send.
          headers=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -D - "$url/")
          echo "$headers" | grep -qi '^content-security-policy:' || { echo "::error::$url/ sent no CSP header."; exit 1; }
          {
            echo "### Docs preview"
            echo
            echo "[$url]($url) for \`$BRANCH\` at \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
