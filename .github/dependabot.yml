version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only; lift this once it accepts 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
